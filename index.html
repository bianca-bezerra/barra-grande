<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barra Grande — divisão de gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF3E3;
    --surface: #FFFFFF;
    --surface2: #F3E6C8;
    --border: #E6D6AC;
    --text: #1E3B3E;
    --muted: #8C7A54;
    --coral: #FF7A52;
    --coral-deep: #E5602F;
    --turquoise: #2FAFA6;
    --turquoise-deep: #1F8A82;
    --success: #4FA37A;
    --danger: #C2452E;
    --radius: 14px;
    --font-display: 'Fraunces', serif;
    --font: 'Manrope', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--text); font-family: var(--font); min-height: 100vh;
    background-image:
      radial-gradient(ellipse 900px 500px at 50% 0%, rgba(30,59,62,.08), transparent 65%),
      radial-gradient(ellipse 1200px 700px at 100% 100%, rgba(30,59,62,.06), transparent 60%),
      url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC43IiBudW1PY3RhdmVzPSIzIiBzZWVkPSIxMSIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjxmZUNvbG9yTWF0cml4IHR5cGU9Im1hdHJpeCIgdmFsdWVzPSIwIDAgMCAwIDAuNTUgIDAgMCAwIDAgMC40NCAgMCAwIDAgMCAwLjI3ICAwIDAgMCAwLjIyIDAiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgZmlsdGVyPSJ1cmwoI24pIi8+PC9zdmc+");
    background-size: auto, auto, 200px 200px;
    background-repeat: no-repeat, no-repeat, repeat;
  }
  *:focus-visible { outline: 2px solid var(--turquoise-deep); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* HERO */
  .hero {
    position: relative;
    background:
      linear-gradient(180deg, rgba(20,45,48,.35) 0%, rgba(20,45,48,.15) 45%, rgba(20,45,48,.55) 100%),
      url("https://images.unsplash.com/photo-1764319088750-149fb68b9df1?auto=format&fit=crop&w=1600&q=80") center 60%/cover no-repeat;
    padding: 3.5rem 1.5rem 4.5rem;
    text-align: center;
    -webkit-clip-path: url(#heroWaveClip);
    clip-path: url(#heroWaveClip);
  }
  .hero-title, .hero-sub { text-shadow: 0 2px 12px rgba(20,45,48,.45); position: relative; z-index: 10; }
  .hero-title {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    font-size: clamp(2.1rem, 5.5vw, 3rem);
    color: #fff;
    letter-spacing: -0.01em;
  }
  .hero-sub {
    font-size: 14.5px;
    color: rgba(255,255,255,.92);
    margin-top: .5rem;
    font-weight: 500;
  }


  /* NAV */
  nav {
    display: flex; align-items: center; justify-content: center; gap: .4rem; flex-wrap: wrap;
    padding: .7rem 1rem;
    background-color: var(--bg);
    background-image:
      url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC43IiBudW1PY3RhdmVzPSIzIiBzZWVkPSIxMSIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjxmZUNvbG9yTWF0cml4IHR5cGU9Im1hdHJpeCIgdmFsdWVzPSIwIDAgMCAwIDAuNTUgIDAgMCAwIDAgMC40NCAgMCAwIDAgMCAwLjI3ICAwIDAgMCAwLjIyIDAiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgZmlsdGVyPSJ1cmwoI24pIi8+PC9zdmc+");
    background-size: 200px 200px;
    background-repeat: repeat;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .tab-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    font-family: var(--font); font-size: 13.5px; font-weight: 600; padding: 7px 16px;
    border-radius: 999px; cursor: pointer; transition: all .15s;
  }
  .tab-btn:hover { color: var(--text); border-color: var(--turquoise); }
  .tab-btn.active { background: var(--turquoise); border-color: var(--turquoise); color: #fff; }

  /* LAYOUT */
  .page { display: none; padding: 2rem 1.5rem; max-width: 1080px; margin: 0 auto; }
  .page.active { display: block; }
  h2 { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 25px; margin-bottom: .3rem; }
  .sub { color: var(--muted); font-size: 13.5px; margin-bottom: 1.5rem; }
  h3 { font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 1rem; }

  /* CARDS */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 4px 16px rgba(30,59,62,.07); }

  /* PAGE HEAD (título + foto solta) */
  .page-head { display: flex; align-items: center; gap: 1.1rem; margin-bottom: 1.5rem; }
  .page-badge {
    height: 80px; width: auto; flex-shrink: 0; display: block;
    filter: drop-shadow(0 8px 10px rgba(30,59,62,.28));
  }
  .page-badge.shell { width: auto; }
  .page-badge.photo {
    width: 80px; height: 80px; object-fit: cover; border-radius: 50%;
    filter: none; box-shadow: 0 6px 16px rgba(30,59,62,.28);
  }
  .page-head h2, .page-head .sub { margin-bottom: 0; }

  /* FORM */
  .form-row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: flex-end; margin-bottom: 1rem; }
  .form-row:last-child { margin-bottom: 0; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 500; }
  input, select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font-family: var(--font); font-size: 14px;
    outline: none; transition: border .15s;
  }
  input:focus, select:focus { border-color: var(--turquoise); }
  input[type=number] { width: 90px; }
  input.wide { width: 220px; }
  select { width: 170px; }

  /* BUTTONS */
  .btn {
    background: var(--coral); color: #fff; border: none; border-radius: 999px;
    padding: 9px 20px; font-family: var(--font); font-size: 13.5px; font-weight: 700;
    cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: var(--coral-deep); }
  .btn.ghost { background: none; color: var(--muted); border: 1px solid var(--border); }
  .btn.ghost:hover { color: var(--text); border-color: var(--text); background: none; }
  .btn.danger { background: none; color: var(--danger); border: 1px solid var(--border); }
  .btn.danger:hover { border-color: var(--danger); }
  .btn.sm { padding: 5px 13px; font-size: 12px; }

  /* TABLE */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 9px 12px; color: var(--muted); font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(47,175,166,.04); }

  /* BADGES */
  .badge { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 999px; font-family: var(--mono); }
  .badge.turq  { background: rgba(47,175,166,.14); color: var(--turquoise-deep); }
  .badge.gray  { background: var(--surface2); color: var(--muted); }
  .badge.green { background: rgba(79,163,122,.15); color: var(--success); }

  /* PESSOAS (roster) */
  .pessoas-roster { display: flex; flex-wrap: wrap; gap: .6rem; }
  .pessoa-card {
    display: flex; align-items: center; gap: .55rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: .3rem .9rem .3rem .3rem; box-shadow: 0 2px 8px rgba(30,59,62,.06);
  }
  .pessoa-avatar {
    width: 30px; height: 30px; border-radius: 50%; background: var(--turquoise); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0;
    overflow: hidden; transition: box-shadow .18s;
  }
  .pessoa-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .pessoa-avatar.lg { width: 46px; height: 46px; font-size: 15px; }
  .avatar-wrap { position: relative; cursor: pointer; flex-shrink: 0; border-radius: 50%; }
  .avatar-wrap::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: rgba(15,40,44,0); transition: background .18s;
  }
  .avatar-wrap:hover::after { background: rgba(15,40,44,.32); }
  .avatar-wrap:hover .pessoa-avatar { box-shadow: 0 0 0 2px var(--coral); }
  .avatar-remove-x {
    position: absolute; top: -4px; left: -4px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border); color: var(--danger);
    display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; z-index: 2;
  }
  .pessoa-nome { font-size: 13.5px; font-weight: 600; }
  .pessoa-remove { background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer; line-height: 1; padding: 2px; }
  .pessoa-remove:hover { color: var(--danger); }

  /* MODAL CHIPS (quem consome) */
  .pessoas-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pessoa-chip {
    display: flex; align-items: center; gap: 5px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 11px; cursor: pointer;
    font-size: 12.5px; transition: all .15s; user-select: none;
  }
  .pessoa-chip input { display: none; }
  .pessoa-chip.checked { background: rgba(47,175,166,.12); border-color: var(--turquoise); color: var(--turquoise-deep); }
  .pessoa-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); transition: background .15s; }
  .pessoa-chip.checked .dot { background: var(--turquoise); }

  /* EXTRATO */
  .extrato-pessoa { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: .75rem; box-shadow: 0 3px 10px rgba(30,59,62,.06); }
  .extrato-header { display: flex; align-items: center; justify-content: space-between; padding: .9rem 1.25rem; cursor: pointer; transition: background .15s; }
  .extrato-header:hover { background: var(--surface2); }
  .extrato-header .nome { font-size: 15px; font-weight: 600; }
  .extrato-header .valores { display: flex; align-items: center; gap: 1rem; }
  .extrato-header .total-val { font-family: var(--mono); font-size: 15px; color: var(--coral-deep); }
  .extrato-body { display: none; border-top: 1px solid var(--border); }
  .extrato-body.open { display: block; }
  .extrato-item { display: flex; align-items: center; justify-content: space-between; padding: .6rem 1.25rem; border-bottom: 1px solid var(--border); font-size: 13px; }
  .extrato-item:last-child { border-bottom: none; }
  .extrato-item .item-info { display: flex; flex-direction: column; gap: 2px; }
  .extrato-item .item-name { font-weight: 600; }
  .extrato-item .item-meta { color: var(--muted); font-size: 11px; }
  .extrato-item .item-val { font-family: var(--mono); font-size: 13px; }

  /* COMPRAS */

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .75rem; margin-bottom: 1.5rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.15rem; box-shadow: 0 3px 10px rgba(30,59,62,.06); }
  .stat-label { font-size: 12px; color: var(--muted); margin-bottom: .4rem; font-weight: 500; }
  .stat-val { font-family: var(--mono); font-size: 21px; font-weight: 500; }
  .stat-val.coral { color: var(--coral-deep); }
  .stat-val.turq  { color: var(--turquoise-deep); }
  .stat-val.green { color: var(--success); }

  /* ABA TOGGLE */
  .aba-toggle { display: flex; gap: 4px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .aba-toggle button {
    background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 7px 18px; font-size: 13px; font-family: var(--font); font-weight: 600; cursor: pointer;
  }
  .aba-toggle button.on { background: rgba(47,175,166,.14); border-color: var(--turquoise); color: var(--turquoise-deep); }

  /* EMPTY / BANNER */
  .empty { text-align: center; padding: 2.5rem 1rem; color: var(--muted); font-size: 14px; }
  .banner {
    background: rgba(255,122,82,.12); border: 1px solid rgba(255,122,82,.35); color: var(--coral-deep);
    border-radius: var(--radius); padding: .9rem 1.1rem; font-size: 13.5px; margin-bottom: 1.25rem; font-weight: 500;
  }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(30,59,62,.55); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; width: 480px; max-width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 16px 44px rgba(20,45,48,.28); }
  .modal h3 { color: var(--text); font-size: 16px; margin-bottom: 1rem; }
  .modal-actions { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1.25rem; }

  .divider { height: 1px; background: var(--border); margin: 1.5rem 0; }

  .pago-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 4px 11px; font-size: 11px; cursor: pointer; font-family: var(--mono); transition: all .15s;
  }
  .pago-btn.pago { background: rgba(79,163,122,.12); border-color: var(--success); color: var(--success); }

  .chevron { transition: transform .2s; display: inline-block; font-size: 12px; color: var(--muted); }
  .chevron.open { transform: rotate(180deg); }

  footer.credits {
    text-align: center; font-size: 11px; color: var(--muted); padding: 1.5rem 1rem 2.5rem;
  }
  footer.credits a { color: var(--muted); }

  @media (max-width: 600px) {
    .page { padding: 1.5rem 1rem; }
    .hero { padding: 2rem 1rem 3.25rem; }
    .page-head { gap: .75rem; }
    .page-badge { width: 50px; height: 50px; }
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
</head>

</svg>

<header class="hero">
  <div class="hero-title">Barra Grande</div>

</header>

<nav>
  <button class="tab-btn active" onclick="showPage('pessoal')">🧑‍🤝‍🧑 Turma</button>
  <button class="tab-btn" onclick="showPage('itens')">🦐 Itens</button>
  <button class="tab-btn" onclick="showPage('extrato')">🌊 Extrato</button>
</nav>

<script>
// ── FIREBASE ───────────────────────────────────────────────────────────────
// Preencha com os valores do seu Firebase Console (veja o tutorial que te mandei)
const firebaseConfig = {
    apiKey: "AIzaSyCmhCP46FCQ6yOb-Jm-Y7_bmWiEsPGwixU",
    authDomain: "barra-e7413.firebaseapp.com",
    databaseURL: "https://barra-e7413-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "barra-e7413",
    storageBucket: "barra-e7413.firebasestorage.app",
    messagingSenderId: "743802005173",
    appId: "1:743802005173:web:6adb8aada6c19432a6c0fc"
};
firebase.initializeApp(firebaseConfig);
const stateRef = firebase.database().ref('viagem-barra-grande/state');

// ── STATE ──────────────────────────────────────────────────────────────────
let state = {
  pessoas: [],      // ['Fernanda', 'Sávio', ...]
  itens: [],        // {id, aba, nome, qtd, und, preco, quemPagou, quemConsome[], comprado}
  pagamentos: {},    // {pessoaNome: {itemId: true/false}}
  fotos: {}          // {pessoaNome: 'data:image/jpeg;base64,...'}
};
let fotoTargetPessoa = null;
let currentAba = 'Comida';
let modalItemId = null;
let nextId = 1;

function recomputeNextId() {
  nextId = state.itens.length ? Math.max(...state.itens.map(i=>i.id)) + 1 : 1;
}

function renderTudo() {
  populateSelects();
  renderPessoas();
  renderItens();
  renderExtrato();
}

// Toda alteração local é gravada no Firebase, que devolve pra todo mundo conectado
function save() { stateRef.set(state); }

// Sempre que QUALQUER pessoa mudar algo, todo mundo recebe e re-renderiza
stateRef.on('value', snapshot => {
  const val = snapshot.val();
  state = {
    pessoas: (val && val.pessoas) || [],
    itens: (val && val.itens) || [],
    pagamentos: (val && val.pagamentos) || {},
    fotos: (val && val.fotos) || {}
  };
  recomputeNextId();
  renderTudo();
});

// ── NAVEGAÇÃO ──────────────────────────────────────────────────────────────
function showPage(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  event.target.classList.add('active');
  if (p === 'pessoal') renderPessoas();
  if (p === 'itens')   renderItens();
  if (p === 'extrato') renderExtrato();
}

function setAba(aba) {
  currentAba = aba;
  document.getElementById('toggle-com').classList.toggle('on', aba==='Comida');
  document.getElementById('toggle-beb').classList.toggle('on', aba==='Bebida');
  document.getElementById('toggle-sup').classList.toggle('on', aba==='Suprimentos');
  renderItens();
}

// ── PESSOAS: cadastro ──────────────────────────────────────────────────────
function addPessoa() {
  const inp = document.getElementById('inp-pessoa-nome');
  const nome = inp.value.trim();
  if (!nome) { inp.focus(); return; }
  if (state.pessoas.includes(nome)) { inp.value = ''; inp.focus(); return; }
  state.pessoas.push(nome);
  save();
  inp.value = '';
  inp.focus();
  renderPessoas();
  populateSelects();
}

function removePessoa(nome) {
  state.pessoas = state.pessoas.filter(p => p !== nome);
  state.itens.forEach(it => {
    it.quemConsome = it.quemConsome.filter(p => p !== nome);
    if (it.quemPagou === nome) it.quemPagou = '';
  });
  delete state.pagamentos[nome];
  delete state.fotos[nome];
  save();
  renderPessoas();
  populateSelects();
}

document.getElementById('inp-pessoa-nome').addEventListener('keydown', e => {
  if (e.key === 'Enter') addPessoa();
});

function initials(nome) {
  return nome.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
}

function avatarInner(nome) {
  const foto = state.fotos[nome];
  return foto ? `<img src="${foto}" alt="${nome}">` : initials(nome);
}

function triggerFotoUpload(nome) {
  fotoTargetPessoa = nome;
  document.getElementById('foto-input').click();
}

function handleFotoSelected(event) {
  const file = event.target.files[0];
  event.target.value = ''; // permite escolher o mesmo arquivo de novo depois
  if (!file || !fotoTargetPessoa) return;
  const nome = fotoTargetPessoa;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const size = 240;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      state.fotos[nome] = canvas.toDataURL('image/jpeg', 0.85);
      save();
      renderPessoas();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  fotoTargetPessoa = null;
}

function removeFoto(nome, ev) {
  ev.stopPropagation();
  delete state.fotos[nome];
  save();
  renderPessoas();
}

function renderPessoas() {
  const el = document.getElementById('pessoas-list');
  if (!state.pessoas.length) {
    el.innerHTML = '<div class="empty">Ninguém na lista ainda. Adicione o primeiro nome acima ↑</div>';
    return;
  }
  el.innerHTML = `
    <div class="card">
      <h3>${state.pessoas.length} na turma</h3>
      <div class="pessoas-roster">
        ${state.pessoas.map(p => `
          <div class="pessoa-card">
            <div class="avatar-wrap" onclick="triggerFotoUpload('${p.replace(/'/g,"\\'")}')" title="Clique para trocar a foto">
              <div class="pessoa-avatar lg">${avatarInner(p)}</div>
              ${state.fotos[p] ? `<span class="avatar-remove-x" onclick="removeFoto('${p.replace(/'/g,"\\'")}', event)" title="Remover foto">✕</span>` : ''}
            </div>
            <span class="pessoa-nome">${p}</span>
            <button class="pessoa-remove" onclick="removePessoa('${p.replace(/'/g,"\\'")}')" title="Remover">✕</button>
          </div>`).join('')}
      </div>
    </div>`;
}

// ── PESSOAS NO SELECT ──────────────────────────────────────────────────────
function populateSelects() {
  const sel = document.getElementById('inp-pagou');
  const atual = sel.value;
  sel.innerHTML = '<option value="">— ninguém ainda —</option>';
  state.pessoas.forEach(p => {
    const o = document.createElement('option'); o.value = p; o.textContent = p; sel.appendChild(o);
  });
  if (state.pessoas.includes(atual)) sel.value = atual;
}

// ── ADICIONAR ITEM ─────────────────────────────────────────────────────────
function addItem() {
  const nome  = document.getElementById('inp-nome').value.trim();
  const qtd   = parseFloat(document.getElementById('inp-qtd').value) || 0;
  const und   = document.getElementById('inp-und').value.trim();
  const preco = parseFloat(document.getElementById('inp-preco').value) || 0;
  const pagou = document.getElementById('inp-pagou').value;
  if (!nome) { document.getElementById('inp-nome').focus(); return; }
  state.itens.push({ id: nextId++, aba: currentAba, nome, qtd, und, preco, quemPagou: pagou, quemConsome: [], comprado: false });
  save();
  document.getElementById('inp-nome').value = '';
  document.getElementById('inp-qtd').value = '';
  document.getElementById('inp-und').value = '';
  document.getElementById('inp-preco').value = '';
  renderItens();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('page-itens').classList.contains('active')) {
    if (document.activeElement && ['inp-nome','inp-qtd','inp-und','inp-preco'].includes(document.activeElement.id)) addItem();
  }
});

// ── RENDER ITENS ───────────────────────────────────────────────────────────
function fmt(v) { return 'R$ ' + v.toFixed(2).replace('.',','); }
function totalItem(it) { return it.qtd * it.preco; }
function valorPessoa(it) {
  const n = it.quemConsome.length || state.pessoas.length || 1;
  return totalItem(it) / n;
}

function renderBanner(elId) {
  document.getElementById(elId).innerHTML = state.pessoas.length
    ? ''
    : '<div class="banner">🏖️ Vá na aba Turma e adicione quem vai dividir os gastos antes de continuar.</div>';
}

function renderItens() {
  renderBanner('itens-banner');
  const itens = state.itens.filter(i => i.aba === currentAba);
  const el = document.getElementById('itens-table');
  if (!itens.length) { el.innerHTML = '<div class="empty">Nenhum item cadastrado. Adicione acima ↑</div>'; return; }

  const totalGeral = itens.reduce((s,i) => s + totalItem(i), 0);
  const totalPessoas = state.pessoas.length;

  el.innerHTML = `
    <div class="card" style="padding:0; overflow:hidden;">
      <table>
        <thead>
          <tr>
            <th>Item</th><th>Qtd / Und</th><th>Preço unit.</th><th>Total</th>
            <th>Quem consome</th><th>Val/pessoa</th><th>Quem pagou</th><th></th>
          </tr>
        </thead>
        <tbody>
          ${itens.map(it => `
            <tr>
              <td style="font-weight:600">${it.nome}</td>
              <td style="font-family:var(--mono)">${it.qtd}${it.und ? ' '+it.und : ''}</td>
              <td style="font-family:var(--mono)">${it.preco ? fmt(it.preco) : '—'}</td>
              <td style="font-family:var(--mono);color:var(--turquoise-deep)">${it.preco ? fmt(totalItem(it)) : '—'}</td>
              <td>
                <button class="btn ghost sm" onclick="openModal(${it.id})">
                  ${it.quemConsome.length ? `<span style="color:var(--turquoise-deep)">${it.quemConsome.length} pessoa${it.quemConsome.length>1?'s':''}</span>` : `<span style="color:var(--muted)">todos (${totalPessoas})</span>`}
                </button>
              </td>
              <td style="font-family:var(--mono);color:var(--coral-deep)">${it.preco ? fmt(valorPessoa(it)) : '—'}</td>
              <td>${it.quemPagou ? `<span class="badge turq">${it.quemPagou}</span>` : '<span class="badge gray">—</span>'}</td>
              <td><button class="btn danger sm" onclick="removeItem(${it.id})">✕</button></td>
            </tr>
          `).join('')}
        </tbody>
        <tfoot>
          <tr>
            <td colspan="3" style="color:var(--muted);font-size:12px;padding:10px 12px">${itens.length} ite${itens.length>1?'ns':'m'}</td>
            <td style="font-family:var(--mono);font-weight:700;color:var(--coral-deep)">${fmt(totalGeral)}</td>
            <td colspan="4"></td>
          </tr>
        </tfoot>
      </table>
    </div>`;
}

function removeItem(id) {
  state.itens = state.itens.filter(i => i.id !== id);
  save(); renderItens();
}

// ── MODAL QUEM CONSOME ─────────────────────────────────────────────────────
function openModal(id) {
  modalItemId = id;
  const it = state.itens.find(i => i.id === id);
  document.getElementById('modal-title').textContent = `Quem vai consumir: ${it.nome}`;
  const grid = document.getElementById('modal-pessoas');
  if (!state.pessoas.length) {
    grid.innerHTML = '<div class="empty" style="padding:1rem 0">Adicione pessoas na aba Turma primeiro.</div>';
  } else {
    grid.innerHTML = state.pessoas.map(p => `
      <label class="pessoa-chip ${it.quemConsome.includes(p)?'checked':''}">
        <input type="checkbox" value="${p}" ${it.quemConsome.includes(p)?'checked':''} onchange="toggleChip(this)">
        <span class="dot"></span>${p}
      </label>`).join('');
  }
  document.getElementById('modal-overlay').classList.add('open');
}

function toggleChip(cb) {
  const chip = cb.closest('.pessoa-chip');
  chip.classList.toggle('checked', cb.checked);
}

function saveModal() {
  const it = state.itens.find(i => i.id === modalItemId);
  it.quemConsome = [...document.querySelectorAll('#modal-pessoas input:checked')].map(c => c.value);
  save(); closeModal(); renderItens();
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  modalItemId = null;
}
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

// ── RENDER EXTRATO ─────────────────────────────────────────────────────────
function renderExtrato() {
  renderBanner('extrato-banner');
  const itensAll = state.itens;

  const extrato = state.pessoas.map(pessoa => {
    const consumos = itensAll.filter(it =>
      it.preco > 0 && (it.quemConsome.length === 0 || it.quemConsome.includes(pessoa))
    ).map(it => ({
      id: it.id, aba: it.aba, nome: it.nome,
      valor: valorPessoa(it),
      pagarA: it.quemPagou || null
    }));
    const total = consumos.reduce((s,c) => s+c.valor, 0);
    const pago  = state.pagamentos[pessoa] || {};
    const totalPago = consumos.filter(c => pago[c.id]).reduce((s,c) => s+c.valor, 0);
    return { pessoa, consumos, total, totalPago, falta: total - totalPago };
  });

  const totalGeral = extrato.reduce((s,e) => s+e.total, 0);
  const totalPagoGeral = extrato.reduce((s,e) => s+e.totalPago, 0);
  const faltaGeral = totalGeral - totalPagoGeral;

  document.getElementById('stats-extrato').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total geral</div><div class="stat-val coral">${fmt(totalGeral)}</div></div>
    <div class="stat-card"><div class="stat-label">Já pago</div><div class="stat-val green">${fmt(totalPagoGeral)}</div></div>
    <div class="stat-card"><div class="stat-label">Falta receber</div><div class="stat-val turq">${fmt(faltaGeral)}</div></div>
    <div class="stat-card"><div class="stat-label">Pessoas</div><div class="stat-val">${extrato.filter(e=>e.falta>0).length} devendo</div></div>`;

  const el = document.getElementById('extrato-list');
  if (!itensAll.length || !state.pessoas.length) { el.innerHTML = '<div class="empty">Cadastre a turma e os itens para ver o extrato.</div>'; return; }

  el.innerHTML = extrato.map(e => {
    const pago = state.pagamentos[e.pessoa] || {};
    return `
    <div class="extrato-pessoa">
      <div class="extrato-header" onclick="toggleExtrato(this)">
        <div style="display:flex;align-items:center;gap:.75rem">
          <div class="pessoa-avatar">${avatarInner(e.pessoa)}</div>
          <div>
            <div class="nome">${e.pessoa}</div>
            <div style="font-size:11px;color:var(--muted)">${e.consumos.length} item${e.consumos.length!==1?'s':''}</div>
          </div>
        </div>
        <div class="valores">
          ${e.falta <= 0
            ? '<span class="badge green">✓ quitado</span>'
            : `<span style="font-size:11px;color:var(--muted)">falta</span><span class="total-val">${fmt(e.falta)}</span>`}
          <span class="chevron">▼</span>
        </div>
      </div>
      <div class="extrato-body">
        ${e.consumos.length === 0
          ? '<div style="padding:1rem 1.25rem;color:var(--muted);font-size:13px">Nenhum item.</div>'
          : e.consumos.map(c => `
            <div class="extrato-item">
              <div class="item-info">
                <div class="item-name">${c.nome}</div>
                <div class="item-meta">${c.aba}${c.pagarA ? ' · pagar a <strong>'+c.pagarA+'</strong>' : ''}</div>
              </div>
              <div style="display:flex;align-items:center;gap:.75rem">
                <span class="item-val">${fmt(c.valor)}</span>
                <button class="pago-btn ${pago[c.id]?'pago':''}" onclick="togglePago('${e.pessoa.replace(/'/g,"\\'")}',${c.id})">
                  ${pago[c.id]?'✓ pago':'pagar'}
                </button>
              </div>
            </div>`).join('')}
        <div style="display:flex;justify-content:space-between;align-items:center;padding:.75rem 1.25rem;background:var(--surface2)">
          <span style="font-size:12px;color:var(--muted)">Total</span>
          <span style="font-family:var(--mono);font-weight:700">${fmt(e.total)}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleExtrato(header) {
  const body = header.nextElementSibling;
  const chev = header.querySelector('.chevron');
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

function togglePago(pessoa, itemId) {
  if (!state.pagamentos[pessoa]) state.pagamentos[pessoa] = {};
  state.pagamentos[pessoa][itemId] = !state.pagamentos[pessoa][itemId];
  save(); renderExtrato();
}

// ── INIT ───────────────────────────────────────────────────────────────────
renderTudo();
</script>
</body>
</html>
